name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: realmeet_test
          POSTGRES_USER: realmeet
          POSTGRES_PASSWORD: realmeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realmeet -d realmeet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DEBUG: 'false'
      SECRET_KEY: ci-test-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+pg8000://realmeet:realmeet@localhost:5432/realmeet_test
      CORS_ORIGINS: '["http://localhost:15173"]'
      EMAIL_MODE: log
      DEFAULT_MEETING_PROVIDER: mock
      ENABLE_DOCS: 'true'
      ENABLE_DEMO_SEED: 'false'
      LOG_LEVEL: INFO
      RATE_LIMIT_ENABLED: 'false'
      WHATSAPP_CLOUD_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_URL: http://localhost:18000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  alembic-check:
    name: alembic-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: realmeet_alembic
          POSTGRES_USER: realmeet
          POSTGRES_PASSWORD: realmeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realmeet -d realmeet_alembic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DEBUG: 'false'
      SECRET_KEY: ci-test-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+pg8000://realmeet:realmeet@localhost:5432/realmeet_alembic
      CORS_ORIGINS: '["http://localhost:15173"]'
      ENABLE_DOCS: 'true'
      ENABLE_DEMO_SEED: 'false'
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate single Alembic head
        working-directory: backend
        run: |
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            alembic heads
            exit 1
          fi
      - name: Upgrade clean database to head
        working-directory: backend
        run: alembic upgrade head
      - name: Verify current revision matches head
        working-directory: backend
        run: |
          current=$(alembic current | awk '{print $1}')
          head=$(alembic heads | awk '{print $1}')
          if [ "$current" != "$head" ]; then
            echo "Alembic current revision $current does not match head $head"
            exit 1
          fi

  openapi-check:
    name: openapi-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DEBUG: 'false'
      SECRET_KEY: ci-test-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+pg8000://realmeet:realmeet@localhost:5432/realmeet_openapi
      CORS_ORIGINS: '["http://localhost:15173"]'
      ENABLE_DOCS: 'true'
      ENABLE_DEMO_SEED: 'false'
      LOG_LEVEL: INFO
      WHATSAPP_CLOUD_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate OpenAPI schema
        run: python scripts/ci/check_openapi.py

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t realmeet-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t realmeet-frontend:ci ./frontend

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-tests
      - frontend-build
      - alembic-check
      - openapi-check
      - docker-build
    env:
      COMPOSE_PROJECT_NAME: realmeet_ci_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_DB: realmeet_ci
      POSTGRES_USER: realmeet
      POSTGRES_PASSWORD: realmeet
      POSTGRES_PORT: '25433'
      BACKEND_PORT: '18080'
      FRONTEND_PORT: '15180'
      APP_ENV: docker
      DEBUG: 'false'
      SECRET_KEY: ci-smoke-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:15180
      VITE_API_URL: http://localhost:18080
      ENABLE_DOCS: 'true'
      ENABLE_DEMO_SEED: 'true'
      EMAIL_MODE: log
      DEFAULT_MEETING_PROVIDER: mock
      LOG_LEVEL: INFO
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run smoke test
        run: bash scripts/ci/smoke.sh
